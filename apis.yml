aid: checkout51
name: checkout51
description: Checkout 51 is a consumer cash-back rewards service, delivered as a free
  mobile app and website, that lets shoppers earn money back on everyday grocery and
  gas purchases. Members browse weekly offers, buy participating brands at any store,
  then upload a photo of their receipt to claim cash back; balances are paid out by
  check once they reach a $20 threshold. The company earns revenue from partner brands
  that fund the offers. It was added to the API Evangelist network as a Slow Ventures
  portfolio company; it operates a consumer app plus a partner/brands program, but
  publishes no public developer API, SDKs, or specifications at this time.
